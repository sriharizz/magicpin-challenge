services:
  - type: web
    name: magicpin-vera
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /v1/healthz
    envVars:
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /data/magicpin_vera.db
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_TIMEOUT_MS
        value: 1500
      - key: TEAM_NAME
        value: Team Vera Alpha
    disk:
      name: vera-data
      mountPath: /data
      sizeGB: 1
